# Push a tag like v5.2.0 and this builds a signed Birdie APK and attaches it to a GitHub release.
# Birdie's "Check for updates" button reads that release.
name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing key is set up
        env:
          KS: ${{ secrets.BIRDIE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Add the BIRDIE_KEYSTORE_BASE64, BIRDIE_STORE_PASSWORD, BIRDIE_KEY_ALIAS and BIRDIE_KEY_PASSWORD secrets first (see README). Without the same key, updates can't install over the app."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Version from the tag
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Point the in-app updater at this repo
        run: echo "window.BIRDIE_REPO = \"${{ github.repository }}\";" > dist/config.js

      - run: npx cap sync android

      - name: Restore the signing key
        env:
          KS: ${{ secrets.BIRDIE_KEYSTORE_BASE64 }}
          SP: ${{ secrets.BIRDIE_STORE_PASSWORD }}
          KA: ${{ secrets.BIRDIE_KEY_ALIAS }}
          KP: ${{ secrets.BIRDIE_KEY_PASSWORD }}
        run: |
          mkdir -p keys
          echo "$KS" | base64 -d > keys/birdie-release.jks
          printf 'storeFile=../../keys/birdie-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SP" "$KA" "$KP" > android/keystore.properties

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../Birdie-${VERSION_NAME}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: Birdie-*.apk
          generate_release_notes: true

      - name: Remove the key from the runner
        if: always()
        run: rm -f keys/birdie-release.jks android/keystore.properties
